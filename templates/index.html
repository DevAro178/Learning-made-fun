<!DOCTYPE html>

<html lang="en" dir="ltr">

  <head>
    <meta charset="utf-8">
    <title>📘Chat with PDF</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- add a favicon icon  -->
    <link rel="icon" href="{{ url_for('static', filename='assets/ollama.png') }}">
    <!-- Google Fonts Link For Icons -->
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="https://code.jquery.com/jquery-3.7.1.slim.min.js"
      integrity="sha256-kmHvs0B+OpCW5GVHUNjv9rOmY0IvSIRcf7zGUDTDQM8=" crossorigin="anonymous"></script>
    <script src="{{url_for('static',filename='index.js')}}" defer></script>
  </head>

  <body>
    <!-- Chats container -->
    <div class="chat-container">
      <div class="default-text">
        <h1>ChatPDF</h1>
        <p>📘Engage with Your PDF Like Never Before</p><br>
        {% if error %}
        <p class="error" style="color:#c0392b;margin-bottom:1rem;">{{ error }}</p>
        {% endif %}
        <div class="container">
          <form class="form fileUploadForm" method="post" enctype="multipart/form-data" action="{{url_for('chat')}}">
            <div class="file-upload-wrapper" data-text="Upload a PDF to continue!">
              <input name="chatPdfFile" type="file" class="file-upload-field" value="" accept="application/pdf">
            </div>
          </form>
        </div>
      </div>
    </div>

  </body>

</html>
